kind = "web"
previewPath = "/"
title = "Baliarda - Control de Blisters"
version = "1.0.0"
id = "artifacts/baliarda-blisters"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21112

[services.development]
run = "pnpm --filter @workspace/baliarda-blisters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/baliarda-blisters", "run", "build" ]
publicDir = "artifacts/baliarda-blisters/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21112"
BASE_PATH = "/"
